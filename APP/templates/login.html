<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Parcel Drop System</title>
</head>

<body>

    <h1>Parcel Drop System</h1>

    <h2>Login</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <p>{{ message }}</p>

            {% endfor %}

        {% endif %}

    {% endwith %}

    <form method="POST"
          action="{{ url_for('auth.login') }}">

        <div>

            <label for="email">
                Email
            </label>

            <br>

            <input
                type="email"
                id="email"
                name="email"
                required
            >

        </div>

        <br>

        <div>

            <label for="password">
                Password
            </label>

            <br>

            <input
                type="password"
                id="password"
                name="password"
                required
            >

        </div>

        <br>

        <button type="submit">
            Login
        </button>

    </form>

</body>

</html>
